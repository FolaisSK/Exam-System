spring:
  application:
    name: ExamSystem

  data:
    mongodb:
      uri: mongodb://localhost:27017/exam_system_db

server:
  port: 8080

jwt:
  secret: exam-system-super-secret-key-must-be-at-least-32-chars
  expiration: 86400000  # 24 hours in milliseconds

logging:
  level:
    org.springframework.data.mongodb: DEBUG

spring:
  security:
    filter:
      order: -100